; Проект PlatformIO для M5Cardputer WebRadio (RU edition)
; Сборка:  pio run -e cardputer
; Прошивка: pio run -e cardputer -t upload

[platformio]
src_dir = M5Cardputer_WebRadio

[env:cardputer]
platform  = espressif32@7.1.0   ; тянет arduino-esp32 2.0.17
board     = m5stack-stamps3
framework = arduino

; Разметка на 4 МБ, один слот приложения на 3 МБ - как в оригинальном образе
board_build.partitions   = huge_app.csv
board_upload.flash_size  = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode   = qio
board_build.f_flash      = 80000000L
board_build.f_cpu        = 240000000L

monitor_speed  = 115200
upload_speed   = 1500000

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DAUDIO_LOG=0
    ; SD_MMC и FFat из ядра не объявляют зависимость от FS
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src"

lib_ldf_mode = chain+
; версии зафиксированы жёстко: релизные бинарники должны собираться одинаково
; и сегодня, и через год
lib_deps =
    m5stack/M5Cardputer @ 1.1.1
    m5stack/M5Unified @ 0.2.21
    m5stack/M5GFX @ 0.2.28
    adafruit/Adafruit NeoPixel @ 1.15.5
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12
