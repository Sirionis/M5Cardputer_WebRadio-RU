; PlatformIO project for M5Cardputer WebRadio (RU edition)
; Build:  ~/.platformio/penv/bin/pio run -e cardputer
; Flash:  ~/.platformio/penv/bin/pio run -e cardputer -t upload

[platformio]
src_dir = M5Cardputer_WebRadio

[env:cardputer]
platform  = espressif32
board     = m5stack-stamps3
framework = arduino

; 4 MB layout, 3 MB single app slot (same table as the original release image)
board_build.partitions   = huge_app.csv
board_upload.flash_size  = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode   = qio
board_build.f_flash      = 80000000L
board_build.f_cpu        = 240000000L

monitor_speed  = 115200
upload_speed   = 1500000

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DAUDIO_LOG=0
    ; SD_MMC/FFat do core nao declaram a dependencia de FS
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src"

lib_ldf_mode = chain+
lib_deps =
    m5stack/M5Cardputer @ ^1.0.3
    adafruit/Adafruit NeoPixel @ ^1.12.3
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12
